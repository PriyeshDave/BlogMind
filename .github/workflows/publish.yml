name: Publish Approved Blog Post

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual re-run for a specific draft (e.g. after a failed publish).
  workflow_dispatch:
    inputs:
      draft_path:
        description: "Draft to publish, e.g. content/drafts/2026-11-03-....md"
        required: true

permissions:
  contents: write

jobs:
  publish:
    # Only run if the PR was actually merged (not just closed) and it was a
    # blog-draft PR opened by the generation workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'blog-draft'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find the merged draft file
        id: find_draft
        env:
          INPUT_DRAFT: ${{ github.event.inputs.draft_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -n "$INPUT_DRAFT" ]; then
            FILE="$INPUT_DRAFT"
          else
            # Use the draft this PR actually added/changed. `ls -t` is not safe
            # here: a fresh checkout gives every file the same mtime, so it
            # picked an arbitrary draft.
            FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$MERGE_SHA" -- 'content/drafts/*.md')
            COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
            if [ "$COUNT" -gt 1 ]; then
              echo "::error::PR touched $COUNT drafts; expected one:"
              echo "$FILES"
              exit 1
            fi
            FILE="$FILES"
          fi
          if [ -z "$FILE" ]; then
            echo "No draft in this PR -- nothing to publish."
          elif [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found in content/drafts/"
            exit 1
          else
            echo "Found draft: $FILE"
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish everywhere
        if: steps.find_draft.outputs.file != ''
        run: python -m src.publishing.publish_all "${{ steps.find_draft.outputs.file }}"
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}

      - name: Commit moved file (drafts -> published)
        if: steps.find_draft.outputs.file != ''
        run: |
          git config user.name "blog-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          git commit -m "Publish: move approved post to content/published/" || echo "Nothing to commit"
          git push origin main